      <!-- 打字 + 逐字删除 + 自动轮换 完整动画 -->
      <script>
      document.addEventListener('DOMContentLoaded', runSubtitle);
      document.addEventListener('pjax:complete', runSubtitle);

      function runSubtitle(){
        const el = document.getElementById('site-subtitle');
        if(!el) return;

        // 轮换文案列表（和你配置里保持一致）
        const texts = [
          "汗は君のために流れる.————POCARI SWEAT",
          "决不跪在地上 以显出刽子手们的高大 好阻挡自由的风————北岛",
          "长风长风飘在山海间 白鸟白鸟展翅入苍天 一去入苍天 苍天远在海背面————ilem「白鸟过河滩」",
          "桜の花の落ちるスピード。秒速5センチメートル。————秒速五厘米 Pt1 「樱花抄」"
        ];

        let nowIndex = 0;
        let charIndex = 0;
        let timer = null;
        const typeSpeed = 100;    // 打字速度
        const delSpeed = 80;     // 删除速度
        const stayTime = 3000;   // 文字停留时长(毫秒)

        // 逐字打字
        function typing() {
          const curr = texts[nowIndex];
          if (charIndex <= curr.length) {
            el.innerText = curr.slice(0, charIndex);
            charIndex++;
            timer = setTimeout(typing, typeSpeed);
          } else {
            // 打完停留，再开始删除
            timer = setTimeout(deleting, stayTime);
          }
        }

        // 逐字删除
        function deleting() {
          const curr = texts[nowIndex];
          if (charIndex > 0) {
            charIndex--;
            el.innerText = curr.slice(0, charIndex);
            timer = setTimeout(deleting, delSpeed);
          } else {
            // 删除完毕，切下一条
            nowIndex = (nowIndex + 1) % texts.length;
            charIndex = 0;
            typing();
          }
        }

        // 初始化
        clearTimeout(timer);
        el.innerText = "";
        typing();
      }
      </script>
