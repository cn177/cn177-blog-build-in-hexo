    # 节气+背景切换 + 24小时记忆 脚本
    - |
      <script>
      // 四张背景图地址
      const bgList = [
        "/img/bg1.png",
        "/img/bg2.png",
        "/img/bg3.png",
        "/img/bg4.png"
      ];
      const STORAGE_KEY = "blog_bg_setting";
      const EXPIRE_HOUR = 24;

      // 按日期获取季节默认背景
      function getAutoBgUrl() {
        const m = new Date().getMonth();
        if(m >= 2 && m <= 4) return "/img/bg1.png";
        if(m >= 5 && m <= 7) return "/img/bg2.png";
        if(m >= 8 && m <= 10) return "/img/bg3.png";
        return "/img/bg4.png";
      }

      // 读取本地存储，判断是否在有效期内
      function getSavedBg() {
        const data = localStorage.getItem(STORAGE_KEY);
        if(!data) return null;
        try {
          const obj = JSON.parse(data);
          const now = Date.now();
          // 超过24小时则失效
          if(now - obj.time > EXPIRE_HOUR * 60 * 60 * 1000) {
            localStorage.removeItem(STORAGE_KEY);
            return null;
          }
          return obj.url;
        } catch(e) {
          localStorage.removeItem(STORAGE_KEY);
          return null;
        }
      }

      // 设置背景
      function setBg(url) {
        const header = document.querySelector("#page-header");
        if(header) {
          header.style.setProperty("background-image", `url(${url})`, "important");
          header.style.backgroundSize = "cover";
          header.style.backgroundPosition = "center";
        }
      }

      // 点击切换背景 + 存入本地记录
      function changeBg(idx) {
        const url = bgList[idx];
        setBg(url);
        // 记录当前时间+地址
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          url: url,
          time: Date.now()
        }));
      }

      // 初始化背景：有有效记录用记录，否则用季节默认
      function initBg() {
        const saved = getSavedBg();
        const targetUrl = saved || getAutoBgUrl();
        setBg(targetUrl);
      }

      // 生成极简切换列表（头部右下）
      function createBgMenu() {
        if(document.getElementById("bg-switch-menu")) return;
        const menu = document.createElement("div");
        menu.id = "bg-switch-menu";
        menu.style.cssText = `
          position: absolute;
          right: 20px;
          bottom: 20px;
          z-index: 999;
          background: rgba(255,255,255,0.7);
          padding: 6px 10px;
          border-radius: 4px;
          @media (max-width: 768px) {
            display: none !important;
          }
        `;
        for(let i = 0; i < 4; i++) {
        const item = document.createElement("span");
        const nameArr = ["春  你的名字。", "夏 秒速五厘米", "秋 败犬女主太多了！", "冬 我的青春恋爱物语果然有问题。"];
       item.innerText = nameArr[i];
       item.style.cssText = `
       margin: 0 8px;
       cursor: pointer;
       user-select: none;
       `;
      item.onclick = () => changeBg(i);
      menu.appendChild(item);
      }
        const header = document.querySelector("#page-header");
        if(header) header.appendChild(menu);
      }

      // 节气弹窗逻辑
      function initSolarTerm() {
        let termMessage = "🍂 节气数据加载中...";
        let season = "冬";
        let bgUrl = "/img/bg4.png";

        try {
          const solarTermsList = [
            { name: "小寒", month: 1, day: 5 }, { name: "大寒", month: 1, day: 20 },
            { name: "立春", month: 2, day: 3 }, { name: "雨水", month: 2, day: 18 },
            { name: "惊蛰", month: 3, day: 5 }, { name: "春分", month: 3, day: 20 },
            { name: "清明", month: 4, day: 4 }, { name: "谷雨", month: 4, day: 19 },
            { name: "立夏", month: 5, day: 5 }, { name: "小满", month: 5, day: 20 },
            { name: "芒种", month: 6, day: 5 }, { name: "夏至", month: 6, day: 21 },
            { name: "小暑", month: 7, day: 7 }, { name: "大暑", month: 7, day: 22 },
            { name: "立秋", month: 8, day: 7 }, { name: "处暑", month: 8, day: 22 },
            { name: "白露", month: 9, day: 7 }, { name: "秋分", month: 9, day: 22 },
            { name: "寒露", month: 10, day: 8 }, { name: "霜降", month: 10, day: 23 },
            { name: "立冬", month: 11, day: 7 }, { name: "小雪", month: 11, day: 22 },
            { name: "大雪", month: 12, day: 6 }, { name: "冬至", month: 12, day: 21 }
          ];

          const today = new Date();
          const year = today.getFullYear();
          let nextTerm = null;
          let minDays = Infinity;

          for (let i = 0; i < solarTermsList.length; i++) {
            const term = solarTermsList[i];
            let termDate = new Date(year, term.month - 1, term.day);
            if (termDate < today) termDate = new Date(year + 1, term.month - 1, term.day);
            const daysDiff = Math.ceil((termDate - today) / (1000 * 60 * 60 * 24));
            if (daysDiff < minDays) {
              minDays = daysDiff;
              nextTerm = term;
            }
          }

          termMessage = minDays === 0 ? `🎉 今日是「${nextTerm.name}」！🎉` : `离「${nextTerm.name}」还有 ${minDays} 天 ✨`;
          const m = today.getMonth();
          if (m >= 2 && m <= 4) {
            season = "春"; bgUrl = "/img/bg1.png";
          } else if (m >= 5 && m <= 7) {
            season = "夏"; bgUrl = "/img/bg2.png";
          } else if (m >= 8 && m <= 10) {
            season = "秋"; bgUrl = "/img/bg3.png";
          } else {
            season = "冬"; bgUrl = "/img/bg4.png";
          }
        } catch (e) {
          termMessage = "🍂 节气数据加载中...";
          season = "冬";
          bgUrl = "/img/bg4.png";
        }

        const oldToast = document.querySelector(".solar-toast");
        if (oldToast) oldToast.remove();

        const now = new Date();
        const dateMsg = `📅 ${(now.getMonth()+1).toString().padStart(2,"0")}月${now.getDate().toString().padStart(2,"0")}日 · ${termMessage}`;
        const toast = document.createElement("div");
        toast.className = "solar-toast";
        toast.innerHTML = `<div style="font-weight:600;margin-bottom:4px;">🌿 节气物语</div><div>${dateMsg}<br>🍂 背景已切换为「${season}季」</div>`;
        toast.style.cssText = "position:fixed;bottom:100px;left:20px;background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);color:white;padding:12px 20px;border-radius:24px;font-size:14px;opacity:0;transition:opacity 0.4s;pointer-events:none;box-shadow:0 4px 15px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.2);line-height:1.5;max-width:260px;z-index:99999 !important; @media (max-width: 768px) { bottom: 60px !important; left: 10px !important; max-width: 220px !important; font-size: 13px !important; }";
        document.body.appendChild(toast);

        setTimeout(() => toast.style.opacity = "1", 100);
        setTimeout(() => toast.style.opacity = "0", 4500);
        setTimeout(() => toast.remove(), 5000);
      }

      // 页面加载
      document.addEventListener("DOMContentLoaded", function() {
        initBg();
        createBgMenu();
        initSolarTerm();
      });

      // PJAX 跳转
      document.addEventListener("pjax:complete", function() {
        initBg();
        createBgMenu();
        initSolarTerm();
      });

      window.addEventListener("popstate", function() {
        initBg();
      });
      </script>

