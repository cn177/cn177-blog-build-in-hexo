    # 节气提示 + 季节背景切换 JS（全页面版）
    - '<script>
        function initSolarTerm() {
          let termMessage = "🍂 节气数据加载中...";
          let season = "冬";
          let bgUrl = "/img/bg4.png";
          
          try {
            const solarTermsList = [
              { name: "小寒", month: 1, day: 5 }, { name: "大寒", month: 1, day: 20 },
              { name: "立春", month: 2, day: 3 }, { name: "雨水", month: 2, day: 18 },
              { name: "惊蛰", month: 3, day: 5 }, { name: "春分", month: 3, day: 20 },
              { name: "清明", month: 4, day: 4 }, { name: "谷雨", month: 4, day: 19 },
              { name: "立夏", month: 5, day: 5 }, { name: "小满", month: 5, day: 20 },
              { name: "芒种", month: 6, day: 5 }, { name: "夏至", month: 6, day: 21 },
              { name: "小暑", month: 7, day: 7 }, { name: "大暑", month: 7, day: 22 },
              { name: "立秋", month: 8, day: 7 }, { name: "处暑", month: 8, day: 22 },
              { name: "白露", month: 9, day: 7 }, { name: "秋分", month: 9, day: 22 },
              { name: "寒露", month: 10, day: 8 }, { name: "霜降", month: 10, day: 23 },
              { name: "立冬", month: 11, day: 7 }, { name: "小雪", month: 11, day: 22 },
              { name: "大雪", month: 12, day: 6 }, { name: "冬至", month: 12, day: 21 }
            ];
            
            const today = new Date();
            const year = today.getFullYear();
            let nextTerm = null;
            let minDays = Infinity;
            
            for (let i = 0; i < solarTermsList.length; i++) {
              const term = solarTermsList[i];
              let termDate = new Date(year, term.month - 1, term.day);
              if (termDate < today) termDate = new Date(year + 1, term.month - 1, term.day);
              const daysDiff = Math.ceil((termDate - today) / (1000 * 60 * 60 * 24));
              if (daysDiff < minDays) {
                minDays = daysDiff;
                nextTerm = term;
              }
            }
            
            termMessage = minDays === 0 ? `🎉 今日是「${nextTerm.name}」！🎉` : `离「${nextTerm.name}」还有 ${minDays} 天 ✨`;
            
            const currentMonth = today.getMonth();
            if (currentMonth >= 2 && currentMonth <= 4) {
              season = "春"; bgUrl = "/img/bg1.png";
            } else if (currentMonth >= 5 && currentMonth <= 7) {
              season = "夏"; bgUrl = "/img/bg2.png";
            } else if (currentMonth >= 8 && currentMonth <= 10) {
              season = "秋"; bgUrl = "/img/bg3.png";
            } else {
              season = "冬"; bgUrl = "/img/bg4.png";
            }
            console.log("节气成功:", termMessage);
          } catch(e) {
            console.log("节气失败，用bg4:", e);
            termMessage = "🍂 节气数据加载中...";
            season = "冬";
            bgUrl = "/img/bg4.png";
          }
          
          // 应用到所有可能的顶部区域
          const selectors = ["#page-header", ".page-header", ".post-header", ".article-header", ".author-info__inner", ".author-info"];
          for (let i = 0; i < selectors.length; i++) {
            const elements = document.querySelectorAll(selectors[i]);
            for (let j = 0; j < elements.length; j++) {
              elements[j].style.setProperty("background-image", `url(${bgUrl})`, "important");
              elements[j].style.backgroundSize = "cover";
              elements[j].style.backgroundPosition = "center";
            }
          }
          
          const now = new Date();
          const dateMsg = `📅 ${(now.getMonth()+1).toString().padStart(2,"0")}月${now.getDate().toString().padStart(2,"0")}日 · ${termMessage}`;
          
          const toast = document.createElement("div");
          toast.innerHTML = `<div style="font-weight:600;margin-bottom:4px;">🌿 节气物语</div><div>${dateMsg}<br>🍂 背景已切换为「${season}季」</div>`;
          toast.style.cssText = "position:fixed;bottom:100px;left:20px;background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);color:white;padding:12px 20px;border-radius:24px;font-size:14px;z-index:99999;opacity:0;transition:opacity 0.4s;pointer-events:none;box-shadow:0 4px 15px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.2);line-height:1.5;max-width:260px";
          document.body.appendChild(toast);
          
          setTimeout(() => { if(toast) toast.style.opacity = "1"; }, 100);
          setTimeout(() => { if(toast) toast.style.opacity = "0"; }, 4500);
          setTimeout(() => { if(toast && toast.remove) toast.remove(); }, 5000);
          
          console.log(`✅ ${dateMsg}, 背景:${season}季`);
        }
        
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initSolarTerm);
        } else {
          initSolarTerm();
        }
      </script>'
  bottom:
    # 运行时间 JS
    - '<script>
        (function() {
          const startDate = new Date("2026/04/01");
          const now = new Date();
          const days = Math.floor((now - startDate) / (1000 * 60 * 60 * 24));
          window.addEventListener("DOMContentLoaded", function() {
            const footerInner = document.querySelector(".footer__inner, .footer-inner, footer .copyright");
            if (footerInner) {
              const runtimeDiv = document.createElement("div");
              runtimeDiv.style.marginTop = "8px";
              runtimeDiv.style.fontSize = "90%";
              runtimeDiv.style.opacity = "0.8";
              runtimeDiv.innerText = `已艰难运行 ${days} 天 | 你怎么看到这里了Ovo`;
              footerInner.appendChild(runtimeDiv);
            }
          });
        })();
      </script>'
