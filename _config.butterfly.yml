    enable: true
    limit: 5
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: true
    limit: 20
  card_webinfo:
    enable: true

# =====================================
# 文章相关
# =====================================
post_copyright:
  enable: true
  license: CC BY-NC 4.0

post_end:
  enable: true
  content: ---------- 本文结束 ❤️ 感谢阅读 ----------

copy_btn: true
highlight_theme: atom-one-dark

# =====================================
# 页脚与社交
# =====================================
footer:
  owner:
    enable: true
    since: 2026
  copyright: true
  custom_text: ' '

social:
  github: https://github.com/cn177 || fab fa-github

rightside:
  enable: true
  comment: true
  share: true

# =====================================
# 加载动画与背景
# =====================================
