# =====================================
# 博客基础信息与头像
# =====================================
avatar:
  img: /img/avatar.png
  effect: true

subtitle:
  enable: true
  effect: true
  loop: true
  source: false
  sub:
    - 汗は君のために流れる.————POCARI SWEAT

favicon: /img/favicon-32x32.png

# =====================================
# 导航菜单
# =====================================
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tag
  关于: /about/ || fas fa-heart

# =====================================
# 侧边栏设置
# =====================================
aside:
  enable: true
  position: right
  card_author:
    enable: true
    description: 这是蛋堡 也叫软嘴唇.
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/cn177
  card_announcement:
    enable: true
    content: 这是公告<br>但我不知道该写啥<br>个人介绍请见<br>『关于我... 请你注意我是软嘴唇』
  card_recent_post:
    enable: true
    limit: 5
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: true
    limit: 20
  card_webinfo:
    enable: true

# =====================================
# 文章相关
# =====================================
post_copyright:
  enable: true
  license: CC BY-NC 4.0

post_end:
  enable: true
  content: ---------- 本文结束 ❤️ 感谢阅读 ----------

copy_btn: true
highlight_theme: atom-one-dark

# =====================================
# 页脚与社交
# =====================================
footer:
  owner:
    enable: true
    since: 2026
  copyright: true
  custom_text: ' '

social:
  github: https://github.com/cn177 || fab fa-github

rightside:
  enable: true
  comment: true
  share: true

# =====================================
# 加载动画与背景
# =====================================
preloader:
  enable: false
# 开启 PJAX（页面无刷新切换，音乐不中断）
pjax:
  enable: true

# 背景图与页脚运行时间的 JavaScript 注入 还有神秘字体
inject:
  head:
    # 加载英文字体 Rajdhani
    - '<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">'
    # 加载开源文艺字体“霞鹜文楷”作为正文默认字体
    - '<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.6.0/style.css" rel="stylesheet">'
    # 加载得意黑字体（副标题专用）
    - '<link href="https://fonts.googleapis.com/css2?family=Smiley+Sans&display=swap" rel="stylesheet">'
    # 注入全局样式
    - '<style>
        /* 全局基础字体：加粗版本 */
        body {
          font-family: "Rajdhani", "LXGW WenKai Screen", "Noto Sans SC", "Microsoft YaHei", sans-serif !important;
          font-weight: 500 !important;
        }
        p, .post-content, .article-content {
          font-weight: 450 !important;
        }
        #site-title,
        .post-title,
        .page-title,
        .archive-title,
        .category-title,
        .tag-title,
        h1, h2, h3, h4, h5, h6 {
          font-family: "SimSun", "Times New Roman", serif !important;
          font-weight: 700 !important;
        }
        #site-subtitle {
          font-family: "Smiley Sans", "LXGW WenKai Screen", sans-serif !important;
          font-weight: 600 !important;
          letter-spacing: 1px;
          font-size: 1.2rem;
        }
        code, pre, .code-content {
          font-family: "JetBrains Mono", "Fira Code", monospace !important;
          font-weight: 400;
        }
        .menus_item a, .menu-item a {
          font-weight: 500 !important;
        }
        .aside-content .card-announcement,
        .aside-content .card_author .description {
          font-weight: 450 !important;
        }
        .post-content::after {
          content: "---------- 本文结束 ❤️ 感谢阅读 ----------";
          display: block;
          text-align: center;
          margin: 40px 0 20px;
          font-size: 14px;
          color: #999;
          font-weight: 400;
        }
        body {
          padding-bottom: 60px !important;
        }
      </style>'
    # 节气提示 + 季节背景切换 JS（最终修复版）
    - '<script>
        (function() {
          let termMessage = "🍂 节气数据加载中...";
          let season = "冬";
          let bgUrl = "/img/bg4.png";
          
          try {
            // 节气近似日期表（公历）
            const solarTermsList = [
              { name: "小寒", month: 1, day: 5 },
              { name: "大寒", month: 1, day: 20 },
              { name: "立春", month: 2, day: 3 },
              { name: "雨水", month: 2, day: 18 },
              { name: "惊蛰", month: 3, day: 5 },
              { name: "春分", month: 3, day: 20 },
              { name: "清明", month: 4, day: 4 },
              { name: "谷雨", month: 4, day: 19 },
              { name: "立夏", month: 5, day: 5 },
              { name: "小满", month: 5, day: 20 },
              { name: "芒种", month: 6, day: 5 },
              { name: "夏至", month: 6, day: 21 },
              { name: "小暑", month: 7, day: 7 },
              { name: "大暑", month: 7, day: 22 },
              { name: "立秋", month: 8, day: 7 },
              { name: "处暑", month: 8, day: 22 },
              { name: "白露", month: 9, day: 7 },
              { name: "秋分", month: 9, day: 22 },
              { name: "寒露", month: 10, day: 8 },
              { name: "霜降", month: 10, day: 23 },
              { name: "立冬", month: 11, day: 7 },
              { name: "小雪", month: 11, day: 22 },
              { name: "大雪", month: 12, day: 6 },
              { name: "冬至", month: 12, day: 21 }
            ];
            
            const today = new Date();
            const year = today.getFullYear();
            const monthNum = today.getMonth() + 1;
            const dayNum = today.getDate();
            const month = monthNum.toString().padStart(2, "0");
            const day = dayNum.toString().padStart(2, "0");
            
            // 计算下一个节气
            let nextTerm = null;
            let minDays = Infinity;
            
            for (let i = 0; i < solarTermsList.length; i++) {
              const term = solarTermsList[i];
              let termDate = new Date(year, term.month - 1, term.day);
              if (termDate < today) {
                termDate = new Date(year + 1, term.month - 1, term.day);
              }
              const daysDiff = Math.ceil((termDate - today) / (1000 * 60 * 60 * 24));
              if (daysDiff < minDays) {
                minDays = daysDiff;
                nextTerm = term;
              }
            }
            
            termMessage = minDays === 0 
              ? `🎉 今日是「${nextTerm.name}」！🎉` 
              : `离「${nextTerm.name}」还有 ${minDays} 天 ✨`;
            
            // 季节背景切换
            const currentMonth = today.getMonth();
            
            if (currentMonth >= 2 && currentMonth <= 4) {
              season = "春";
              bgUrl = "/img/bg1.png";
            } else if (currentMonth >= 5 && currentMonth <= 7) {
              season = "夏";
              bgUrl = "/img/bg2.png";
            } else if (currentMonth >= 8 && currentMonth <= 10) {
              season = "秋";
              bgUrl = "/img/bg3.png";
            } else {
              season = "冬";
              bgUrl = "/img/bg4.png";
            }
            
            console.log("节气计算成功:", termMessage);
          } catch(e) {
            console.log("节气计算失败，使用备用背景 bg4:", e);
            termMessage = "🍂 节气数据加载中...";
            season = "冬";
            bgUrl = "/img/bg4.png";
          }
          
          // 应用背景图
          const header = document.querySelector("#page-header");
          if (header) {
            header.style.setProperty("background-image", `url(${bgUrl})`, "important");
            header.style.backgroundSize = "cover";
            header.style.backgroundPosition = "center";
            console.log("背景已设置:", bgUrl);
          } else {
            console.log("未找到 #page-header 元素");
          }
          
          const todayDate = new Date();
          const monthStr = (todayDate.getMonth() + 1).toString().padStart(2, "0");
          const dayStr = todayDate.getDate().toString().padStart(2, "0");
          const dateMessage = `📅 ${monthStr}月${dayStr}日 · ${termMessage}`;
          
          // 创建通知气泡
          var toastDiv = document.createElement("div");
          toastDiv.innerHTML = `<div style="font-weight: 600; margin-bottom: 4px;">🌿 节气物语</div><div>${dateMessage}<br>🍂 背景已切换为「${season}季」</div>`;
          toastDiv.style.cssText = `
            position: fixed;
            bottom: 100px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            color: white;
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 14px;
            font-family: system-ui, -apple-system, sans-serif;
            z-index: 99999;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            line-height: 1.5;
            max-width: 260px;
          `;
          document.body.appendChild(toastDiv);
          
          setTimeout(function() { 
            if (toastDiv) toastDiv.style.opacity = "1"; 
          }, 200);
          setTimeout(function() { 
            if (toastDiv) toastDiv.style.opacity = "0"; 
          }, 5000);
          setTimeout(function() { 
            if (toastDiv && toastDiv.remove) toastDiv.remove(); 
          }, 5500);
          
          console.log(`✅ ${dateMessage}, 背景已切换至${season}季`);
        })();
      </script>'
  bottom:
    # 运行时间 JS
    - '<script>
        (function() {
          const startDate = new Date("2026/04/01");
          const now = new Date();
          const days = Math.floor((now - startDate) / (1000 * 60 * 60 * 24));
          window.addEventListener("DOMContentLoaded", function() {
            const footerInner = document.querySelector(".footer__inner, .footer-inner, footer .copyright");
            if (footerInner) {
              const runtimeDiv = document.createElement("div");
              runtimeDiv.style.marginTop = "8px";
              runtimeDiv.style.fontSize = "90%";
              runtimeDiv.style.opacity = "0.8";
              runtimeDiv.innerText = `已艰难运行 ${days} 天 | 你怎么看到这里了Ovo`;
              footerInner.appendChild(runtimeDiv);
            }
          });
        })();
      </script>'
